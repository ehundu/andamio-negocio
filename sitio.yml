# Lo único obligatorio es el nombre y la dirección del sitio, sin ruta
nombre: Pedalada
url: https://ejemplo.com
descripcion: Taller y tienda de bicicletas en Bilbao. Revisiones, reparaciones y alquiler.

formato: 1
idioma: es
zonaHoraria: Europe/Madrid

# Un enlace a otro dominio escrito en Markdown se abre en otra pestaña, con un aviso para los lectores de pantalla
enlacesExternos:
  aviso: (se abre en una pestaña nueva)
  clase: oculto
  noreferrer: sí

